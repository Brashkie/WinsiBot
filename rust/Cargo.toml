[package]
name = "winsibot-session-api"
version = "5.4.0"
edition = "2021"

[lib]
name = "winsibot_session_api"
path = "src/lib.rs"

[[bin]]
name = "winsibot-session-api"
path = "src/main.rs"

[dependencies]
dashmap = "6"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "compression-gzip", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
regex    = { version = "1", features = ["unicode"] }
reqwest  = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing-appender = "0.2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

# harness = false: Criterion trae el suyo, el de libtest estorba.
[[bench]]
name = "rate_limiter"
harness = false

[[bench]]
name = "storage"
harness = false
