[package]
name = "winsibot-cluster"
version = "0.1.0"
edition = "2021"
description = "Motor de almacenamiento LSM propio de WinsiBot: WAL, memtable, SSTables y compactación, sin dependencias"
publish = false

[lib]
name = "cluster"

# Sin dependencias a propósito: el motor es WAL + memtable + SSTables + Bloom +
# CRC32, todo en std. SQLite está solo en dev-dependencies, para el benchmark
# que decide si el motor sirve para algo (examples/compare.rs) — la misma
# versión que ya usa la Session API, así que no baja nada nuevo.
[dependencies]

[dev-dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
