[package]
name = "winsibot-session-api"
version = "5.20.0"
edition = "2021"

[lib]
name = "winsibot_session_api"
path = "src/lib.rs"

[[bin]]
name = "winsibot-session-api"
path = "src/main.rs"

[dependencies]
dashmap = "6"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Solo el timeout: la compresión y el trazado por pedido se fueron en la 9.3
# (ver la nota en main.rs).
tower-http = { version = "0.5", features = ["timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# Los nonces y las claves del sello de la sesión (seal.rs, vault.rs), del
# generador del sistema operativo. Ya llegaba por uuid, en la misma versión:
# se declara porque el código propio la usa.
getrandom = "0.4"
base64 = "0.22"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
regex    = { version = "1", features = ["unicode"] }
reqwest  = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing-appender = "0.2.5"
# Solo PNG, JPEG y GIF (los stickers animados, ver animation.rs; el crate gif
# ya estaba en el árbol por resvg): default-features trae una docena de
# decodificadores (tiff, bmp, ico, avif...) que este proyecto no usa y que
# alargan el build y engordan el binario.
image    = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
# libwebp de Google, compilado de su código C dentro del binario —como el
# SQLite de rusqlite—: los stickers (ver sticker.rs). Reemplaza a sharp, que
# era un addon .node con libvips (30 MB en disco). Sin `parallel`: compila
# en serie, y así no arrastra jobserver.
libwebp-sys = { version = "0.14", default-features = false, features = ["std"] }
# El decodificador de JPEG que `image` ya usa por dentro, directo: así sale en
# RGBA sin pasar por RGB (en una foto de 4000x3000, la conversión del crate
# costaba 17 ms). No suma crates: ya estaban en el árbol.
zune-jpeg = "0.5"
zune-core = "0.5"
# SVG a imagen (ver render.rs): las tarjetas de #qc, #texto, el perfil y el
# mapa. Rust puro, con las fuentes del sistema. Sin `svgz` (SVG comprimido,
# que el bot no arma).
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
# El lector de fuentes que usvg ya usa por dentro: para elegir el respaldo de
# un símbolo (ver render::respaldo). No suma crates.
skrifa = "0.44"
# ONNX Runtime para los modelos de imagen (ver vision.rs). `download-binaries`
# baja el runtime nativo al compilar, asi que no hay que instalarlo aparte.
ort      = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "ndarray"] }
ndarray  = "0.17"

[features]
# Los kernels de Anime4K en C y Zig (native/), compilados con Zig dentro del
# binario. Apagada por defecto: sin Zig instalado el crate compila igual, con
# los kernels de Rust. Los binarios de las releases salen con ella puesta.
native = []
# La decisión del antirrobo de grupos en Ada/SPARK (ada/), demostrada con
# GNATprove y compilada con GNAT. Apagada por defecto: sin ella decide la copia
# en Rust de src/group_guard.rs, que un test compara contra Ada en toda entrada.
# Pide `gcc` de GNAT en el PATH (con Alire: `alr exec -- cargo build`), o la
# ruta en WINSI_GNAT_GCC.
ada = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

# harness = false: Criterion trae el suyo, el de libtest estorba.
[[bench]]
name = "rate_limiter"
harness = false

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "imagefx"
harness = false

[[bench]]
name = "anime4k"
harness = false

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "message"
harness = false
