name: Release

# Compila la Session API para cada plataforma y la publica en la release.
#
# Es lo que hace que instalar WinsiBot sea `npm install` y nada más:
# `scripts/fetch_rust.js` corre en postinstall, baja de acá el binario de su
# plataforma y se salta los ~4 minutos de `cargo build --release`.
#
# Si para una plataforma no hay binario, no pasa nada: el script lo dice en una
# línea y compilar desde fuente sigue funcionando igual.

on:
  push:
    tags: ["v*"]
  # Para probar el pipeline sin etiquetar nada.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Que falle uno no debe cancelar los demás: es mejor publicar 5 de 6
      # binarios que ninguno.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            # Linker cruzado: el host es x86_64.
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc

          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""

          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""

          # Termux. NO es `aarch64-unknown-linux-gnu`: Android usa la libc
          # Bionic, no glibc, y confundirlos da un binario que baja bien y no
          # arranca. ONNX Runtime publica build para este target (con NNAPI),
          # así que los comandos de imagen también funcionan en el teléfono.
          - target: aarch64-linux-android
            os: ubuntu-latest
            ext: ""
            ndk: true

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: Linker cruzado (Linux ARM)
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
          echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr 'a-z-' 'A-Z_')_LINKER=${{ matrix.linker }}" >> $GITHUB_ENV

      - name: NDK de Android (Termux)
        if: matrix.ndk
        run: |
          # El runner ya trae el NDK; solo hay que apuntarle el linker. La API
          # 24 es el mínimo que pide Termux.
          NDK="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$NDK/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$NDK/llvm-ar" >> $GITHUB_ENV

      - name: Compilar
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Renombrar y firmar con SHA-256
        shell: bash
        run: |
          cd rust/target/${{ matrix.target }}/release
          NOMBRE="winsibot-session-api-${{ matrix.target }}${{ matrix.ext }}"
          mv "winsibot-session-api${{ matrix.ext }}" "$NOMBRE"
          # `shasum -a 256` existe en los tres runners; `sha256sum` no está en macOS.
          shasum -a 256 "$NOMBRE" > "$NOMBRE.sha256"
          ls -la "$NOMBRE"*

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            rust/target/${{ matrix.target }}/release/winsibot-session-api-*
          if-no-files-found: error

  publicar:
    name: Publicar en la release
    needs: build
    runs-on: ubuntu-latest
    # Solo con una etiqueta: un `workflow_dispatch` compila y deja los
    # artefactos, pero no toca ninguna release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binarios
          merge-multiple: true

      - name: Lo que se va a publicar
        run: ls -la binarios/

      - uses: softprops/action-gh-release@v2
        with:
          files: binarios/*
          # Que falte una plataforma no debe impedir publicar el resto.
          fail_on_unmatched_files: false
          body: |
            Binarios de la Session API, uno por plataforma.

            No hace falta bajarlos a mano: `npm install` corre
            `scripts/fetch_rust.js`, detecta la plataforma y baja el que
            corresponde, verificando su SHA-256.

            Si para tu plataforma no hay binario, el script lo dice y podés
            compilar con `npm run rust:build` como siempre.
