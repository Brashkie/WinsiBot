name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ─── TypeScript ──────────────────────────────────────────────────────────────
  typescript:
    name: TypeScript check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Desde 9.3, cero diagnósticos: una advertencia de biome hace fallar el
      # job, igual que un error de tsc.
      - name: Lint
        run: npx biome lint --error-on-warnings

      - name: Tests
        run: npx vitest run

  # ─── Rust ────────────────────────────────────────────────────────────────────
  rust:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # El workspace está en la raíz desde la 8.15.0 (crates/*). Ya no se
      # escribe un .env de mentira: `cargo check` compila, no ejecuta, y la
      # configuración solo se lee al arrancar.
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace --all-targets

      # Desde 9.3: el formato de rustfmt y clippy sin una sola advertencia.
      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      - name: Tests
        run: cargo test --workspace --release

      # Los kernels de C y Zig contra Rust: Anime4K bit a bit, y el códec
      # JPEG decodificado y comparado con el original. Es lo que demuestra que
      # calculan bien, que es lo único que justifica tenerlos.
      - uses: ./.github/actions/instalar-zig

      - name: Tests con los kernels nativos
        run: cargo test --release -p winsibot-session-api --features native

      - name: Clippy con los kernels nativos
        run: cargo clippy -p winsibot-session-api --all-targets --release --features native -- -D warnings

      # En x86-64 cada kernel de Zig viene dos veces: baseline y x86-64-v3
      # (AVX2), y se elige según la CPU (src/simd.rs). El paso de arriba usa la
      # v3 si el runner la tiene; este obliga la baseline, así las dos quedan
      # probadas contra la referencia en Rust en cada push.
      - name: Tests con los kernels nativos en baseline (SSE2)
        run: cargo test --release -p winsibot-session-api --features native
        env:
          WINSI_SIMD: baseline

  # ─── Kernels nativos en ARM ──────────────────────────────────────────────────
  # Los mismos tests bit a bit, EJECUTADOS en ARM64, que es donde corre Termux.
  # Los kernels de Zig son vectores (@Vector), y en ARM esos vectores son NEON
  # y no SSE: compilar cruzado (lo que hace release.yml) dice que el código es
  # válido, no que dé lo mismo que Rust. Hasta la 8.17.0 nadie lo comprobaba.
  arm:
    name: Kernels nativos en ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/instalar-zig

      - name: Tests con los kernels nativos
        run: cargo test --release -p winsibot-session-api --features native

      # Cuánto tarda #upscale en ARM, por etapa, en un núcleo y en todos: el
      # número que no se puede medir desde un PC con x86. Solo informa, no
      # falla por lento (un runner compartido no es un teléfono).
      # La pasada de a 16 (la que ganó en x86) y de a 8, en un núcleo y en
      # todos: con estos números se elige la de ARM (ver anime4k::carriles).
      - name: "Medir #upscale en ARM"
        run: |
          cargo build --release -p winsibot-session-api --features native --example profile_stages
          for c in 16 8; do
            WINSI_A4K_CARRILES=$c WINSI_HILOS=1 ./target/release/examples/profile_stages media/WinsiBot.png 2
            WINSI_A4K_CARRILES=$c ./target/release/examples/profile_stages media/WinsiBot.png 2
          done

  # ─── Antirrobo en Ada/SPARK ──────────────────────────────────────────────────
  # La decisión del antirrobo de grupos (crates/session-api/ada) está en SPARK:
  # GNATprove demuestra sus garantías para toda entrada, y con
  # --checks-as-errors una sola sin demostrar hace fallar el job. Desde 9.3
  # también el libro de saldos de la economía, el lector de montos y el ritmo
  # de salida del antiban. Después,
  # las copias en Rust —las que llevan Android y Linux ARM, sin GNAT— contra
  # Ada.
  ada:
    name: Antirrobo en Ada/SPARK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Instalar Alire y GNAT
        uses: alire-project/setup-alire@v4
        with:
          version: "2.1.1"

      # Alire genera config/ —que el .gpr importa y está en .gitignore— al
      # compilar el crate, no con `alr exec`. Compilar primero, además, pasa el
      # código por todas las advertencias y el estilo de Ada.
      - name: Compilar el crate de Ada
        working-directory: crates/session-api/ada
        run: alr -n build

      - name: Demostrar con GNATprove
        working-directory: crates/session-api/ada
        run: alr -n exec -- gnatprove -P group_guard.gpr --level=4 -j0 --checks-as-errors=on

      # El antirrobo, en sus 1.280 entradas; el libro de saldos, en los bordes
      # y en un millón de entradas al azar; el lector de montos, en las
      # 2.396.745 tiras cortas (la misma huella que el test de TypeScript) y
      # en un millón de largas; el ritmo de salida, en un millón de pedidos y
      # en los bordes de la escalada.
      - name: Ada contra las copias en Rust
        working-directory: crates/session-api/ada
        run: alr -n exec -- bash -c 'cd ../../.. && cargo test --release -p winsibot-session-api --features ada -- group_guard ledger amount send_pacing'

      - name: Clippy con Ada
        working-directory: crates/session-api/ada
        run: alr -n exec -- bash -c 'cd ../../.. && cargo clippy -p winsibot-session-api --all-targets --release --features ada -- -D warnings'

  # ─── Release ─────────────────────────────────────────────────────────────────
  # Solo corre al pushear un tag "vX.Y.Z" — crea el Release en GitHub con notas
  # autogeneradas, y solo después de que los 4 checks de arriba pasen en verde.
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [typescript, rust, arm, ada]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "WinsiBot ${{ github.ref_name }}"
          generate_release_notes: true
